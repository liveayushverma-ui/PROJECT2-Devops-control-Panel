<!DOCTYPE html>
<html>
<head>
    <title>DevOps Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .card { background-color: #1e293b; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">🚀 DevOps Control Panel</h1>

    <div class="row">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>CPU Usage</h5>
                <canvas id="cpuChart"></canvas>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h5>Memory Usage</h5>
                <canvas id="memoryChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
let cpuData = [];
let memoryData = [];
let labels = [];

const cpuChart = new Chart(document.getElementById('cpuChart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'CPU %',
            data: cpuData,
            borderColor: 'cyan',
            fill: false
        }]
    }
});

const memoryChart = new Chart(document.getElementById('memoryChart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Memory %',
            data: memoryData,
            borderColor: 'orange',
            fill: false
        }]
    }
});

function fetchMetrics() {
    fetch('/metrics')
    .then(response => response.json())
    .then(data => {
        const time = new Date().toLocaleTimeString();

        if (labels.length > 10) {
            labels.shift();
            cpuData.shift();
            memoryData.shift();
        }

        labels.push(time);
        cpuData.push(data.cpu);
        memoryData.push(data.memory);

        cpuChart.update();
        memoryChart.update();
    });
}

setInterval(fetchMetrics, 3000);
</script>

</body>
</html>
